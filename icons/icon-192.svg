<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F1A"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Main Orb -->
  <circle cx="96" cy="96" r="50" fill="url(#orbGrad)" filter="url(#glow)"/>
  
  <!-- Highlight -->
  <ellipse cx="80" cy="80" rx="15" ry="10" fill="rgba(255,255,255,0.3)" transform="rotate(-30 80 80)"/>
  
  <!-- Smaller orbs -->
  <circle cx="45" cy="60" r="12" fill="#F59E0B" opacity="0.9"/>
  <circle cx="147" cy="60" r="12" fill="#EF4444" opacity="0.9"/>
  <circle cx="45" cy="132" r="12" fill="#10B981" opacity="0.9"/>
  <circle cx="147" cy="132" r="12" fill="#06B6D4" opacity="0.9"/>
</svg>
